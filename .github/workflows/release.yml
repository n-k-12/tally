# Push a tag like v0.1.0 to build TallySetup on Windows and attach it to a draft release.
# Check the draft on GitHub, then publish it; the app's update check only sees published releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('tally/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version in tally/__init__.py"; exit 1
          fi

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        run: python build/build.py

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/TallySetup-*.exe --draft --generate-notes --title "Tally $GITHUB_REF_NAME"
