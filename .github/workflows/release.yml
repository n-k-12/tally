# Push a tag like v0.2.0 to build Tally for Windows and Mac (Apple Silicon), check both start,
# and attach them to a draft release. Check the draft on GitHub, then publish it; the app's
# update check only sees published releases.
# Run it by hand (Actions → Release → Run workflow) to build and check without releasing;
# the builds are then kept as downloadable artifacts on the run's page.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('tally/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version in tally/__init__.py"; exit 1
          fi

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build
        run: python build/build.py

      - name: Check the app starts
        run: python build/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: tally-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Tally $GITHUB_REF_NAME"
